# ClusterFuzzLite / OSS-Fuzz project metadata for Purple Disc.
# These same files (project.yaml, Dockerfile, build.sh) are what OSS-Fuzz proper
# expects under projects/purpledisc/ if/when the project is submitted there.
language: go
main_repo: "https://github.com/Scharkenberg/PurpleDisc"
fuzzing_engines:
  - libfuzzer
sanitizers:
  - address
