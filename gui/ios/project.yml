name: PurpleDisc
options:
  bundleIdPrefix: dev.scharkenberg
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # Automatic signing. Signing is disabled ONLY for the simulator (no cert
    # needed) via the SDK-conditional key below, so simulator/CI builds succeed
    # with no account configured. For a REAL-DEVICE run, set your own team in
    # Xcode (Signing & Capabilities) or pass it on the CLI:
    #   xcodebuild ... -allowProvisioningUpdates DEVELOPMENT_TEAM=<your-team-id>
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"

targets:
  PurpleDisc:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/PurpleDisc
      - path: Resources/Assets.xcassets
      - path: Resources/Localizable.xcstrings
      - path: Resources/InfoPlist.xcstrings
      # Inter, kept once in the repository: the variable font and its license (the static files there are Android's).
      - path: ../../assets/fonts/InterVariable.ttf
        buildPhase: resources
      - path: ../../assets/fonts/Inter-OFL.txt
        buildPhase: resources
    dependencies:
      - framework: Pdmobile.xcframework
        embed: false
        link: true
    settings:
      base:
        PRODUCT_NAME: PurpleDisc
        PRODUCT_BUNDLE_IDENTIFIER: dev.scharkenberg.PurpleDisc
        INFOPLIST_FILE: Resources/Info.plist
        # Multicast entitlement so Connect discovery works on physical devices
        # (iOS 14+ blocks multicast/broadcast from BSD sockets without it).
        # The capability must be granted to your App ID by Apple for device
        # signing; simulator builds ignore it (signing disabled).
        CODE_SIGN_ENTITLEMENTS: Resources/PurpleDisc.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "4.0.0"
        CURRENT_PROJECT_VERSION: "21"
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
