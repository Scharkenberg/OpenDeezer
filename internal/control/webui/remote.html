<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0d13">
<meta name="color-scheme" content="dark">
<title>Purple Disc Remote</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Ccircle cx='60' cy='60' r='60' fill='%239A45FF'/%3E%3Cg fill='none' stroke='%23fff' stroke-linecap='round'%3E%3Cpath d='M100.57 49.13A42 42 0 1 1 77.75 21.94' stroke-width='9'/%3E%3Cpath d='M65.12 89.05A29.5 29.5 0 0 1 35.84 43.08' stroke-width='5' opacity='.65'/%3E%3C/g%3E%3Ccircle cx='92.17' cy='33' r='5' fill='%23fff' opacity='.65'/%3E%3Cpath fill='%23fff' fill-rule='evenodd' d='M60 39A21 21 0 1 0 60 81A21 21 0 1 0 60 39ZM57.43 50.06L70.57 57.94Q74 60 70.57 62.06L57.43 69.94Q54 72 54 68L54 52Q54 48 57.43 50.06Z'/%3E%3C/svg%3E">
<style>
@font-face { font-family: Inter; font-weight: 400; font-display: swap; src: url("/remote/Inter-Regular.woff2") format("woff2"); }
@font-face { font-family: Inter; font-weight: 600; font-display: swap; src: url("/remote/Inter-SemiBold.woff2") format("woff2"); }
:root {
  --accent: #9A45FF;
  --accent-strong: #b77aff;
  --accent-soft: rgba(154, 69, 255, 0.18);
  --bg: #0f0d13;
  --surface: rgba(255, 255, 255, 0.06);
  --surface-hi: rgba(255, 255, 255, 0.10);
  --line: rgba(255, 255, 255, 0.12);
  --text: #f4f1f8;
  --muted: rgba(244, 241, 248, 0.72);
  --danger: #ff7a8e;
  --r-lg: 12px;
  --r-md: 8px;
  --r-sm: 6px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; background: var(--bg); color: var(--text); }
body {
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.35;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; -webkit-touch-callout: none; user-select: none; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { width: 24px; height: 24px; fill: currentColor; flex-shrink: 0; }

/* The cover, blurred, behind everything. */
#backdrop {
  position: fixed; inset: -40px; z-index: -2;
  background-size: cover; background-position: center;
  filter: blur(48px) saturate(1.2); opacity: 0; transition: opacity 0.6s;
}
#backdrop.on { opacity: 0.55; }
#shade { position: fixed; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(15,13,19,0.55) 0%, rgba(15,13,19,0.92) 55%, var(--bg) 100%); }

.page {
  min-height: 100vh; min-height: 100dvh;
  display: flex; align-items: center; justify-content: center;
  padding: calc(20px + var(--safe-top)) 20px calc(20px + var(--safe-bottom));
}

/* ---- Pairing ---- */
#pair-view { display: flex; flex-direction: column; align-items: center; gap: 18px; width: 100%; max-width: 360px; text-align: center; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
.brand svg { width: 40px; height: 40px; }
#pair-intro { color: var(--muted); font-size: 15px; }
#code-input {
  width: 100%; padding: 16px; font-size: 34px; font-weight: 600; letter-spacing: 0.4em; text-indent: 0.4em;
  text-align: center; font-variant-numeric: tabular-nums;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); outline: none;
  transition: border-color 0.15s, background 0.15s;
}
#code-input:focus { border-color: var(--accent); background: var(--surface-hi); }
#code-input::placeholder { color: rgba(244,241,248,0.25); }
#pair-btn {
  width: 100%; padding: 15px; font-size: 16px; font-weight: 600; color: #fff;
  background: var(--accent); border-radius: var(--r-md); transition: background 0.15s, opacity 0.15s, transform 0.1s;
}
#pair-btn:active { transform: scale(0.98); background: var(--accent-strong); }
#pair-btn:disabled { opacity: 0.6; }
#pair-error { color: var(--danger); font-size: 14px; min-height: 1.3em; }

/* ---- Controls ---- */
#ctrl-view { display: none; width: 100%; max-width: 440px; gap: 22px; }
.player { display: flex; flex-direction: column; align-items: center; gap: 18px; width: 100%; }
#artwork-wrap {
  width: min(78vw, 300px); aspect-ratio: 1; border-radius: var(--r-lg); overflow: hidden;
  background: var(--surface); box-shadow: 0 18px 48px rgba(0,0,0,0.55); flex-shrink: 0;
  display: grid; place-items: center;
}
#artwork { width: 100%; height: 100%; object-fit: cover; display: none; }
#artwork-placeholder svg { width: 72px; height: 72px; fill: var(--muted); }
.track-info { width: 100%; text-align: center; }
#track-title { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#track-artist { margin-top: 4px; font-size: 16px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#state-badge { margin-top: 8px; display: inline-block; min-height: 22px; padding: 2px 8px; border-radius: var(--r-sm); font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface); }
#state-badge:empty { visibility: hidden; }
#state-badge::first-letter { text-transform: uppercase; }

/* Sliders: seek, volume, preamp */
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; cursor: pointer; touch-action: pan-y; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--fill, var(--text)) var(--pct, 0%), rgba(255,255,255,0.18) var(--pct, 0%)); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: rgba(255,255,255,0.18); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--fill, var(--text)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.4); }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 50%; background: var(--text); }
input[type=range]:disabled { opacity: 0.4; cursor: default; }
.seek { width: 100%; }
.time-row { display: flex; justify-content: space-between; margin-top: 2px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.transport { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 340px; }
.icon-btn { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: var(--text); transition: background 0.15s, color 0.15s, transform 0.1s; position: relative; }
.icon-btn:active { transform: scale(0.92); background: var(--surface-hi); }
.icon-btn.on { color: var(--accent-strong); }
.icon-btn.on::after { content: ""; position: absolute; bottom: 5px; width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
.icon-btn .badge { position: absolute; top: 9px; right: 7px; font-size: 10px; font-weight: 600; }
.icon-btn.big svg { width: 32px; height: 32px; }
#playpause-btn { width: 72px; height: 72px; background: var(--text); color: var(--bg); box-shadow: 0 10px 28px rgba(0,0,0,0.45); }
#playpause-btn svg { width: 34px; height: 34px; }
#playpause-btn:active { background: #fff; }

.volume-row { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 340px; color: var(--muted); }
.volume-row svg { width: 20px; height: 20px; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border-radius: var(--r-md); font-size: 14px; font-weight: 600; color: var(--muted); background: var(--surface); border: 1px solid transparent; transition: color 0.15s, background 0.15s, border-color 0.15s; }
.chip svg { width: 18px; height: 18px; }
.chip.on { color: var(--text); background: var(--accent-soft); border-color: rgba(154,69,255,0.55); }
.chip:active { opacity: 0.7; }

.card { width: 100%; background: rgba(255, 255, 255, 0.07); border: 1px solid var(--line); border-radius: var(--r-lg); }

/* Queue */
#queue-panel { display: none; flex-direction: column; padding: 14px 8px 8px; }
#queue-panel.open, #eq-panel.open { display: flex; }
.card-title { padding: 0 10px 8px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; }
#queue-list { display: flex; flex-direction: column; max-height: 46vh; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
.queue-row { display: flex; align-items: center; min-height: 52px; border-radius: var(--r-sm); }
.queue-row.current { background: var(--accent-soft); }
.queue-row.current .queue-track-title { color: var(--accent-strong); }
.queue-jump { flex: 1; min-width: 0; padding: 8px 10px; text-align: start; border-radius: var(--r-sm); }
.queue-jump:active { background: var(--surface-hi); }
.queue-jump-static { cursor: default; }
.queue-track-title, .queue-track-artist { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.queue-track-title { font-size: 15px; font-weight: 600; }
.queue-track-artist { margin-top: 2px; font-size: 13px; color: var(--muted); }
.queue-remove { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex-shrink: 0; }
.queue-remove svg { width: 18px; height: 18px; }
.queue-remove:active { background: var(--surface-hi); }

/* Equalizer */
#eq-panel { display: none; flex-direction: column; gap: 14px; padding: 16px; }
.eq-toggle-row { display: flex; gap: 8px; justify-content: center; }
#eq-preset { width: 100%; padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-hi); border: 1px solid var(--line); outline: none; }
#eq-preset option { background: #1d1a23; }
#eq-bands { display: flex; width: 100%; }
.eq-band { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.eq-slider-wrap { position: relative; width: 100%; height: 120px; }
.eq-slider { position: absolute; left: 50%; top: 50%; width: 120px !important; transform: translate(-50%, -50%) rotate(-90deg); }
.eq-band-label { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.eq-preamp-row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
#eq-preamp-val { min-width: 3.8em; text-align: end; font-variant-numeric: tabular-nums; }
#eq-error { font-size: 13px; color: var(--muted); text-align: center; }
#eq-error:empty { display: none; }

/* Wide screens: the player beside the queue. */
@media (min-width: 820px) {
  #ctrl-view { max-width: 880px; grid-template-columns: 400px 1fr; align-items: start; }
  #ctrl-view.shown { display: grid; }
  .side { display: flex; flex-direction: column; gap: 16px; }
  #queue-list { max-height: 60vh; }
  /* No queue and the equalizer closed: the player alone, centered. */
  #ctrl-view.shown:not(:has(.side > .open)) { grid-template-columns: 400px; justify-content: center; }
  #ctrl-view.shown:not(:has(.side > .open)) .side { display: none; }
}
@media (max-width: 819px) {
  #ctrl-view.shown { display: flex; flex-direction: column; align-items: center; }
  .side { display: flex; flex-direction: column; gap: 16px; width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<div class="page">
<!-- Pairing view -->
<div id="pair-view">
  <div class="brand"><svg aria-hidden="true"><use href="#i-mark"/></svg>Purple Disc</div>
  <p id="pair-intro">Enter the 6-digit code shown on your device to pair your phone as a remote.</p>
  <input id="code-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••••" autocomplete="one-time-code" enterkeyhint="go" aria-label="Pairing code">
  <button id="pair-btn" type="button">Pair</button>
  <div id="pair-error" role="alert"></div>
</div>

<!-- Controls view -->
<div id="ctrl-view">
  <div class="player">
    <div id="artwork-wrap">
      <div id="artwork-placeholder"><svg aria-hidden="true"><use href="#i-note"/></svg></div>
      <img id="artwork" src="" alt="">
    </div>
    <div class="track-info">
      <div id="track-title">Not playing</div>
      <div id="track-artist"></div>
      <div id="state-badge"></div>
    </div>
    <div class="seek">
      <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
      <div class="time-row"><span id="time-pos">0:00</span><span id="time-dur">0:00</span></div>
    </div>
    <div class="transport">
      <button id="shuffle-btn" class="icon-btn" type="button"><svg aria-hidden="true"><use href="#i-shuffle"/></svg></button>
      <button id="prev-btn" class="icon-btn big" type="button"><svg aria-hidden="true"><use href="#i-prev"/></svg></button>
      <button id="playpause-btn" class="icon-btn" type="button"><svg aria-hidden="true"><use id="playpause-icon" href="#i-play"/></svg></button>
      <button id="next-btn" class="icon-btn big" type="button"><svg aria-hidden="true"><use href="#i-next"/></svg></button>
      <button id="repeat-btn" class="icon-btn" type="button"><svg aria-hidden="true"><use href="#i-repeat"/></svg><span class="badge" id="repeat-badge"></span></button>
    </div>
    <div class="volume-row">
      <svg aria-hidden="true"><use href="#i-vol-low"/></svg>
      <input id="volume-slider" type="range" min="0" max="100" value="80" aria-label="Volume">
      <svg aria-hidden="true"><use href="#i-vol-high"/></svg>
    </div>
    <div class="chips">
      <button id="sleep-btn" class="chip" type="button"><svg aria-hidden="true"><use href="#i-moon"/></svg><span id="sleep-label">Sleep</span></button>
      <button id="eq-btn" class="chip" type="button"><svg aria-hidden="true"><use href="#i-eq"/></svg><span id="eq-label">Equalizer</span></button>
    </div>
  </div>

  <div class="side">
    <div id="eq-panel" class="card">
      <div class="eq-toggle-row">
        <button id="eq-enable-btn" class="chip" type="button">EQ: off</button>
        <button id="eq-mono-btn" class="chip" type="button">Mono: off</button>
      </div>
      <select id="eq-preset" title="Preset"></select>
      <div id="eq-bands"></div>
      <div class="eq-preamp-row">
        <label for="eq-preamp">Preamp</label>
        <input id="eq-preamp" type="range" min="-12" max="12" step="0.5" value="0">
        <span id="eq-preamp-val">0 dB</span>
      </div>
      <div id="eq-error"></div>
    </div>
    <div id="queue-panel" class="card">
      <div id="queue-title" class="card-title">Queue</div>
      <div id="queue-list"></div>
    </div>
  </div>
</div>
</div>

// ---- View switching ----
function showPair() {
  pairView.style.display = 'flex';
  ctrlView.classList.remove('shown');
  stopStateUpdates();
  codeInput.focus();
}

function showControls() {
  pairView.style.display = 'none';
  ctrlView.classList.add('shown');
  startStateUpdates();
}

// ---- Pairing ----
function setPairError(msg) { pairError.textContent = msg; }
function pairIdle() { pairBtn.disabled = false; pairBtn.textContent = t('pair'); }

pairBtn.addEventListener('click', doPair);
codeInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') doPair(); });
// Digits only; a complete code pairs at once.
codeInput.addEventListener('input', function () {
  var digits = codeInput.value.replace(/\D/g, '').slice(0, 6);
  if (digits !== codeInput.value) codeInput.value = digits;
  setPairError('');
  if (digits.length === 6) doPair();
});

function doPair() {
  var code = codeInput.value.trim();
  if (code.length !== 6) { setPairError(t('enterCode')); return; }
  if (pairBtn.disabled) return;
  setPairError('');
  pairBtn.disabled = true;
  pairBtn.textContent = t('pairing');

  fetch('/pair', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code: code })
  }).then(function (r) {
    if (r.status === 429) { setPairError(t('tooMany')); pairIdle(); return null; }
    if (r.status === 401 || r.status === 404) { setPairError(t('invalidCode')); pairIdle(); codeInput.select(); return null; }
    if (!r.ok) { setPairError(tf('errorRetry', r.status)); pairIdle(); return null; }
    return r.json();
  }).then(function (data) {
    if (!data) return;
    token = data.token;
    localStorage.setItem(SESSION_KEY, token);
    queueCapabilities = {jump: null, remove: null};
    queueProbeInFlight = false;
    if (queueProbeRetryTimer) clearTimeout(queueProbeRetryTimer);
    queueProbeRetryTimer = null;
    queueRenderKey = '';
    pairIdle();
    codeInput.value = '';
    showControls();
  }).catch(function () {
    setPairError(t('networkErr'));
    pairIdle();
  });
}

// ---- API helpers ----
function api(method, path) {
  return fetch(path, {
    method: method,
    headers: { 'X-PurpleDisc-Session': token }
  }).then(function (r) {
    if (r.status === 401) {
      localStorage.removeItem(SESSION_KEY);
      token = null;
      showPair();
      setPairError(t('sessionExpired'));
      return Promise.reject(new Error('unauthorized'));
    }
    if (!r.ok) {
      var err = new Error('http ' + r.status);
      err.status = r.status;
      return Promise.reject(err);
    }
    return r.json();
  });
}

// ---- State updates ----
// EventSource cannot set the session header used by the other API calls, so
// /events accepts the paired session token in this endpoint-only query string.
// Once SSE fails, close it before starting the poller so the two paths can never
// update the UI concurrently.
function startStateUpdates() {
  stopStateUpdates();
  if (!token || !window.EventSource) { startPolling(); return; }

  var source = new EventSource('/events?session=' + encodeURIComponent(token));
  eventSource = source;
  // The stream leaves the queue out while queueVersion is unchanged; keep the last one it sent.
  var queue = [], queueVersion = 0;

  source.addEventListener('state', function (e) {
    if (eventSource !== source) return;
    try {
      var st = JSON.parse(e.data);
      if (st.queue === undefined && st.queueVersion && st.queueVersion === queueVersion) st.queue = queue;
      queue = st.queue || [];
      queueVersion = st.queueVersion || 0;
      applyState(st);
    } catch (_) {
      // A malformed event is skipped; the next snapshot recovers.
    }
  });
  source.onopen = function () { if (eventSource === source) clearEventConnectTimer(); };
  source.onerror = function () { fallbackToPolling(source); };
  // A connection can stay in CONNECTING without an error on some networks.
  eventConnectTimer = setTimeout(function () { fallbackToPolling(source); }, 5000);
}

function fallbackToPolling(source) {
  if (eventSource !== source) return;
  source.close();
  eventSource = null;
  clearEventConnectTimer();
  startPolling();
}

function clearEventConnectTimer() {
  if (!eventConnectTimer) return;
  clearTimeout(eventConnectTimer);
  eventConnectTimer = null;
}

function stopStateUpdates() {
  clearEventConnectTimer();
  if (eventSource) { eventSource.close(); eventSource = null; }
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  setClock(false);
}

function startPolling() {
  poll();
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(poll, 1000);
}

function poll() { api('GET', '/status').then(applyState).catch(function () {}); }

// A phone that slept comes back to a fresh state stream.
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && token) startStateUpdates();

// ---- UI update ----
function fmtTime(ms) {
  var s = Math.floor(ms / 1000), m = Math.floor(s / 60);
  s = s % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function setFill(slider, pct) { slider.style.setProperty('--pct', pct + '%'); }
// A write only when the text changes: the state arrives every second.
function setText(el, s) { if (el.textContent !== s) el.textContent = s; }

  seekSlider.value = Math.round(pct * 10);

// Capability probes use an impossible but well-formed queue index. A wired callback
// answers 409 (or a harmless 200); an unavailable route 404/501. Controls stay hidden
// until both optional callbacks have answered.
var QUEUE_PROBE_INDEX = 2147483647;

function probeQueueCapability(path) {
  return api('POST', path).then(function (st) {
    applyState(st);
    return true;
  }).catch(function (err) {
    if (err && err.status === 409) return true;
    if (err && (err.status === 404 || err.status === 501)) return false;
    return null; // transient/unknown failure: retry without hiding support
  });
}

function probeQueueCapabilities() {
  if (!token || queueProbeInFlight || queueProbeRetryTimer ||
      (queueCapabilities.jump !== null && queueCapabilities.remove !== null)) return;
  queueProbeInFlight = true;
  Promise.all([
    queueCapabilities.jump === null ? probeQueueCapability('/queue/jump?i=' + QUEUE_PROBE_INDEX) : Promise.resolve(queueCapabilities.jump),
    queueCapabilities.remove === null ? probeQueueCapability('/queue/remove?i=' + QUEUE_PROBE_INDEX) : Promise.resolve(queueCapabilities.remove)
  ]).then(function (results) {
    if (results[0] !== null) queueCapabilities.jump = results[0];
    if (results[1] !== null) queueCapabilities.remove = results[1];
    queueProbeInFlight = false;
    queueRenderKey = '';
    if (queueCapabilities.jump === null || queueCapabilities.remove === null) {
      queueProbeRetryTimer = setTimeout(function() {
        queueProbeRetryTimer = null;
        probeQueueCapabilities();
      }, 5000);
      return;

  });

    queueList.textContent = '';
    queueRenderKey = '';
    shownIndex = -1;
    return;

  if (queueCapabilities.jump === null || queueCapabilities.remove === null) {
    queuePanel.classList.remove('open');
    probeQueueCapabilities();
    return;

  queue.forEach(function (track, index) {
    track = track || {};
    var row = document.createElement('div');
    row.className = 'queue-row' + (index === current ? ' current' : '');

    var jump = document.createElement(queueCapabilities.jump ? 'button' : 'div');
    if (queueCapabilities.jump) jump.type = 'button';

    var title = document.createElement('span');
    title.className = 'queue-track-title';

    }

    queueCapabilities[capability] = true;
    applyState(st);
  }).catch(function (err) {
    if (err && (err.status === 404 || err.status === 501)) {
      queueCapabilities[capability] = false;
      queueRenderKey = '';
      renderQueue(currentState);
    }
  });
}

function applyState(st) {
  currentState = st;

  // The playing track; with none, the queue's current row, which Play starts.
  var tr = st.track;
  var queue = Array.isArray(st.queue) ? st.queue : [];
  var ready = false;
  if (!(tr && tr.title)) {
    var row = queue[queueIndexOf(st)];
    if (row && row.title) { tr = row; ready = true; }
  }
  setText(trackTitle, tr && tr.title ? tr.title : t('notPlaying'));
  setText(trackArtist, (tr && tr.title && tr.artist) || '');
  var art = (tr && tr.artworkUrl) || '';
  if (art !== shownArt) {
    shownArt = art;
    if (art) {
      artworkImg.src = art;
      backdrop.style.backgroundImage = 'url("' + art.replace(/"/g, '%22') + '")';
      backdrop.classList.add('on');
    } else {
      artworkImg.removeAttribute('src');
      artworkImg.style.display = 'none';
      artworkPlh.style.display = 'block';
      backdrop.classList.remove('on');
    }
  }

  // Progress
  posBase = ready ? 0 : (st.positionMs || 0);
  posAt = performance.now();
  posDur = ready ? (tr.durationMs || 0) : (st.durationMs || (tr && tr.durationMs) || 0);
  seekSlider.disabled = posDur <= 0 || ready;
  setClock(st.state === 'playing' && !ready && posDur > 0);
  renderPos();
  setText(timeDur, fmtTime(posDur));

  // Play / pause
  var playing = st.state === 'playing' || st.state === 'loading';
  playpauseIcon.setAttribute('href', playing ? '#i-pause' : '#i-play');

  setText(stateBadge, ready ? t('ready') : (st.state && st.state !== 'playing' ? stateLabel(st.state) : ''));

  // Volume
  if (!volumeActive) {
    var vPct = Math.round((st.volume || 0) * 100);
    volSlider.value = vPct;
    setFill(volSlider, vPct);
  }

  // Repeat
  var rep = st.repeat || 'off';
  repeatBtn.classList.toggle('on', rep !== 'off');
  setText(repeatBadge, rep === 'one' ? '1' : '');
  repeatBtn.title = rep === 'one' ? t('repeatOne') : (rep === 'all' ? t('repeatAll') : t('repeatOff'));
  repeatBtn.setAttribute('aria-label', repeatBtn.title);

  // Shuffle
  shuffleBtn.classList.toggle('on', !!st.shuffle);
  shuffleBtn.title = st.shuffle ? t('shuffleOn') : t('shuffle');
  shuffleBtn.setAttribute('aria-pressed', st.shuffle ? 'true' : 'false');

  // Sleep timer
  sleepBtn.classList.toggle('on', !!st.sleepActive);
  sleepBtn.setAttribute('aria-pressed', st.sleepActive ? 'true' : 'false');
  setText(sleepLabel, st.sleepActive && st.sleepEndOfTrack ? t('sleepEnd')
    : st.sleepActive ? tf('sleepMin', Math.max(1, Math.round((st.sleepRemainingMs || 0) / 60000))) : t('sleep'));

  renderQueue(st);
}

// ---- Transport ----
playpauseBtn.addEventListener('click', function () { send('/playpause'); });
prevBtn.addEventListener('click', function () { send('/prev'); });
nextBtn.addEventListener('click', function () { send('/next'); });

// ---- Seek: the slider follows the finger and seeks on release ----
function seekDuration() { return currentState.durationMs || (currentState.track && currentState.track.durationMs) || 0; }
seekSlider.addEventListener('input', function () {
  seekActive = true;
  var ratio = parseInt(seekSlider.value, 10) / 1000;
  setFill(seekSlider, ratio * 100);
  timePos.textContent = fmtTime(ratio * seekDuration());
});
seekSlider.addEventListener('change', function () {
  var dur = seekDuration();
  var ms = Math.round(parseInt(seekSlider.value, 10) / 1000 * dur);
  if (dur <= 0) { seekActive = false; return; }
  api('POST', '/seek?ms=' + ms).then(function (st) { seekActive = false; applyState(st); }).catch(function () { seekActive = false; });
});

// ---- Volume ----
volSlider.addEventListener('input', function () {
  volumeActive = true;
  setFill(volSlider, parseInt(this.value, 10));
});
volSlider.addEventListener('change', function () {
  var v = parseInt(this.value, 10) / 100;
  api('POST', '/volume?v=' + v.toFixed(4)).then(function (st) { volumeActive = false; applyState(st); }).catch(function () { volumeActive = false; });
});

// ---- Repeat (off, all, one) and shuffle ----
var repeatCycle = ['off', 'all', 'one'];
repeatBtn.addEventListener('click', function () {
  var cur = currentState.repeat || 'off';
  send('/repeat?mode=' + repeatCycle[(repeatCycle.indexOf(cur) + 1) % repeatCycle.length]);
});
shuffleBtn.addEventListener('click', function () { send('/shuffle?on=' + (currentState.shuffle ? 'false' : 'true')); });

// ---- Sleep timer (off, 5, 10, 20, 30, 45, 60 min, end of track: the apps' presets) ----
var sleepCycle = [0, 5, 10, 20, 30, 45, 60, -1];
function currentSleepStep() {
  if (!currentState.sleepActive) return 0;
  if (currentState.sleepEndOfTrack) return sleepCycle.length - 1;
  var mins = Math.round((currentState.sleepRemainingMs || 0) / 60000);
  var closest = 1, best = 1e9;
  for (var i = 1; i < sleepCycle.length - 1; i++) {
    var d = Math.abs(sleepCycle[i] - mins);
    if (d < best) { best = d; closest = i; }
  }
  return closest;
}
sleepBtn.addEventListener('click', function () {
  var v = sleepCycle[(currentSleepStep() + 1) % sleepCycle.length];
  send(v === 0 ? '/sleep?cancel=1' : (v < 0 ? '/sleep?eot=1' : '/sleep?minutes=' + v));
});

// ---- Equalizer ----
// The state lives in the engine (GET/POST /eq); it is read again each time the panel opens.
var eqState = null, eqSliders = [], eqDragBand = -1, eqSendTimer = null, eqPendingBands = {};

function fmtBandHz(hz) { return hz >= 1000 ? (hz / 1000) + 'k' : Math.round(hz) + ''; }
function bandFill(s) { setFill(s, (parseFloat(s.value) + 12) / 24 * 100); }

function buildEQBands(bands) {
  eqBands.innerHTML = '';
  eqSliders = [];
  bands.forEach(function (hz, i) {
    var col = document.createElement('div');
    col.className = 'eq-band';
    var wrap = document.createElement('div');
    wrap.className = 'eq-slider-wrap';
    var s = document.createElement('input');
    s.type = 'range';
    s.className = 'eq-slider';
    s.min = -12; s.max = 12; s.step = 0.5; s.value = 0;
    s.style.setProperty('--fill', 'var(--accent)');
    s.setAttribute('aria-label', fmtBandHz(hz) + ' Hz');
    s.addEventListener('input', function () { bandFill(s); onBandInput(i, parseFloat(s.value)); });
    s.addEventListener('change', function () { onBandChange(i, parseFloat(s.value)); });
    wrap.appendChild(s);
    var lbl = document.createElement('div');
    lbl.className = 'eq-band-label';
    lbl.textContent = fmtBandHz(hz);
    col.appendChild(wrap);
    col.appendChild(lbl);
    eqBands.appendChild(col);
    eqSliders.push(s);
  });
}

function buildEQPresets(presets) {
  eqPreset.innerHTML = '';
  presets.forEach(function (name) {
    var o = document.createElement('option');
    o.value = name;
    o.textContent = name.replace(/-/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
    eqPreset.appendChild(o);
  });
  // "custom" shows after a band was moved by hand; it cannot be picked.
  var custom = document.createElement('option');
  custom.value = 'custom';
  custom.textContent = t('custom');
  custom.disabled = true;
  eqPreset.appendChild(custom);
}

function applyEQ(eq) {
  eqState = eq;
  eqError.textContent = '';
  if (eqSliders.length === 0 && eq.bands) buildEQBands(eq.bands);
  if (eqPreset.options.length === 0 && eq.presets) buildEQPresets(eq.presets);
  eqEnableBtn.classList.toggle('on', !!eq.enabled);
  eqEnableBtn.textContent = eq.enabled ? t('eqOn') : t('eqOff');
  eqMonoBtn.classList.toggle('on', !!eq.mono);
  eqMonoBtn.textContent = eq.mono ? t('monoOn') : t('monoOff');
  eqPreset.value = eq.preset || 'flat';
  (eq.gainsDb || []).forEach(function (db, i) {
    if (i !== eqDragBand && eqSliders[i]) { eqSliders[i].value = db; bandFill(eqSliders[i]); }
  });
  var pre = eq.preampDb || 0;
  eqPreamp.value = pre;
  setFill(eqPreamp, (pre + 12) / 24 * 100);
  eqPreampVal.textContent = (pre > 0 ? '+' : '') + pre + ' dB';
}

function refreshEQ() {
  api('GET', '/eq').then(applyEQ).catch(function () { eqError.textContent = t('eqUnavailable'); });
}

eqBtn.addEventListener('click', function () {
  var open = eqPanel.classList.toggle('open');
  eqBtn.classList.toggle('on', open);
  eqBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  if (open) refreshEQ();
});
eqEnableBtn.addEventListener('click', function () {
  api('POST', '/eq?on=' + ((eqState && eqState.enabled) ? '0' : '1')).then(applyEQ).catch(function () {});
});
eqMonoBtn.addEventListener('click', function () {
  api('POST', '/eq?mono=' + ((eqState && eqState.mono) ? '0' : '1')).then(applyEQ).catch(function () {});
});
eqPreset.addEventListener('change', function () {
  api('POST', '/eq?preset=' + encodeURIComponent(this.value)).then(applyEQ).catch(function () {});
});

// Band drags show "Custom" at once and send at most 30 changes a second.
function onBandInput(i, db) {
  eqDragBand = i;
  eqPreset.value = 'custom';
  eqPendingBands[i] = db;
  if (!eqSendTimer) eqSendTimer = setTimeout(flushEQBands, 33);
}
function flushEQBands() {
  eqSendTimer = null;
  var pend = eqPendingBands;
  eqPendingBands = {};
  Object.keys(pend).forEach(function (i) { api('POST', '/eq?band=' + i + '&db=' + pend[i]).catch(function () {}); });
}
function onBandChange(i, db) {
  eqDragBand = -1;
  delete eqPendingBands[i];
  api('POST', '/eq?band=' + i + '&db=' + db).then(applyEQ).catch(function () {});
}
eqPreamp.style.setProperty('--fill', 'var(--accent)');
eqPreamp.addEventListener('input', function () {
  var v = parseFloat(this.value);
  setFill(eqPreamp, (v + 12) / 24 * 100);
  eqPreampVal.textContent = (v > 0 ? '+' : '') + v + ' dB';
});
eqPreamp.addEventListener('change', function () {
  api('POST', '/eq?preamp=' + this.value).then(applyEQ).catch(function () {});
});

// ---- Static text ----
function applyStaticI18n() {
  document.documentElement.lang = LANG;
  if (LANG === 'ar') document.documentElement.dir = 'rtl';
  $('pair-intro').textContent = t('pairIntro');
  pairBtn.textContent = t('pair');
  prevBtn.title = t('prev'); prevBtn.setAttribute('aria-label', t('prev'));
  nextBtn.title = t('next'); nextBtn.setAttribute('aria-label', t('next'));
  playpauseBtn.title = t('playPause'); playpauseBtn.setAttribute('aria-label', t('playPause'));
  shuffleBtn.setAttribute('aria-label', t('shuffle'));
  trackTitle.textContent = t('notPlaying');
  sleepLabel.textContent = t('sleep');
  eqLabel.textContent = t('equalizer');
  eqEnableBtn.textContent = t('eqOff');
  eqMonoBtn.textContent = t('monoOff');
  eqPreset.title = t('preset');
  queueTitle.textContent = t('queue');
  volSlider.setAttribute('aria-label', t('volume'));
  seekSlider.setAttribute('aria-label', t('seek'));
  document.querySelector('.eq-preamp-row label').textContent = t('preamp');
}

// ---- Init ----
applyStaticI18n();
if (token) showControls(); else showPair();

})();
</script>
</body>
</html>
