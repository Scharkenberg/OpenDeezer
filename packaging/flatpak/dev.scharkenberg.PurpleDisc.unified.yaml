# Flatpak manifest for the Purple Disc unified Linux client (dlopen launcher).
#
# The unified launcher picks a backend (GTK or Qt) at runtime via dlopen. Flatpak
# pins one runtime, so this build targets the KDE runtime (Qt6 + QtWebEngine) and
# ships the Qt backend — inside the sandbox the launcher resolves
# libpurpledisc-qt.so. To also bundle the GTK backend you would need the GNOME
# stack (gtk4 + libadwaita + webkitgtk) added as modules, which is heavy; GTK
# desktops are better served by dev.scharkenberg.PurpleDisc.yaml (the GNOME flatpak).
#
# NOTE on Flathub: the build fetches Go modules (no build-time network on
# Flathub) — vendor them and drop `--share=network` for submission.
app-id: dev.scharkenberg.PurpleDisc.unified
runtime: org.kde.Platform
runtime-version: "6.8"
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: purpledisc
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.mpris.MediaPlayer2.PurpleDisc
build-options:
  append-path: /usr/lib/sdk/golang/bin
  env:
    GOFLAGS: "-trimpath"
modules:
  - name: purpledisc-unified
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      # Build the engine c-archive + the Qt backend (.so) via the KDE build.
      - cd gui/kde && chmod +x build.sh && ./build.sh
      # The dlopen launcher loads libpurpledisc-*.so from its own dir ($ORIGIN).
      - cc -O2 -o purpledisc gui/linux/launcher.c -ldl -Wl,-rpath,'$ORIGIN'
      - install -Dm755 purpledisc /app/bin/purpledisc
      - install -Dm755 gui/kde/build/libpurpledisc-qt.so /app/bin/libpurpledisc-qt.so
      - install -Dm755 gui/kde/purpledisc-login /app/bin/purpledisc-login
      # Variant desktop file: Icon must match the exported icon name below (the
      # gui/linux one references dev.scharkenberg.PurpleDisc, which this flatpak
      # cannot export under its app-id prefix).
      - install -Dm644 packaging/flatpak/dev.scharkenberg.PurpleDisc.unified.desktop /app/share/applications/dev.scharkenberg.PurpleDisc.unified.desktop
      - install -Dm644 assets/icon.png /app/share/icons/hicolor/256x256/apps/dev.scharkenberg.PurpleDisc.unified.png
    sources:
      - type: git
        url: https://github.com/Scharkenberg/PurpleDisc.git
        tag: v4.0.0
