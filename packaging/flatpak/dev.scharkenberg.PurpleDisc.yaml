# Flatpak manifest for the Purple Disc GNOME (GTK4/libadwaita) client.
#
# The GNOME runtime ships GTK4, libadwaita and WebKitGTK (for the login web view);
# Go comes from the freedesktop golang SDK extension.
#
# NOTE on Flathub: the build below fetches Go modules, which Flathub's sandbox
# forbids (no network at build time). For Flathub submission, vendor the modules
# and drop the `--share=network` build-arg — generate a sources manifest with
# flatpak-builder-tools (flatpak-go-mod / flatpak-go-vendor). For a LOCAL build
# (`flatpak-builder --user --install build dev.scharkenberg.PurpleDisc.yaml`) the
# network build-arg below is sufficient.
app-id: dev.scharkenberg.PurpleDisc
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: purpledisc-gnome
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.mpris.MediaPlayer2.PurpleDisc
build-options:
  append-path: /usr/lib/sdk/golang/bin
  env:
    GOFLAGS: "-trimpath"
modules:
  - name: purpledisc
    buildsystem: simple
    # For a local build, allow network so `go build` can fetch modules.
    build-options:
      build-args:
        - --share=network
    build-commands:
      - cd gui/gnome && chmod +x build.sh && ./build.sh
      - install -Dm755 gui/gnome/purpledisc-gnome /app/bin/purpledisc-gnome
      - install -Dm644 gui/gnome/build/dev.scharkenberg.PurpleDisc.desktop/app/share/applications/dev.scharkenberg.PurpleDisc.desktop
      - install -Dm644 gui/gnome/data/purpledisc.png /app/share/icons/hicolor/256x256/apps/dev.scharkenberg.PurpleDisc.png
    sources:
      - type: git
        url: https://github.com/Scharkenberg/PurpleDisc.git
        tag: v4.0.0
