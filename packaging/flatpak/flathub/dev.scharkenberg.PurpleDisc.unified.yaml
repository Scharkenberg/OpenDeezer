# Flathub submission manifest — Purple Disc unified Linux client (Qt6 / KDE).
#
# Differs from packaging/flatpak/dev.scharkenberg.PurpleDisc.unified.yaml (the local
# build) in the ways Flathub requires:
#   * NO build-time network — Go modules are vendored via the generated go.mod.yml
#     (see gen-and-build.sh) and the build runs with GOFLAGS=-mod=vendor.
#   * source is pinned to a tag AND commit.
#   * the AppStream metainfo is installed and validated.
# The runtime `--share=network` stays: the app itself must reach Deezer.
app-id: dev.scharkenberg.PurpleDisc.unified
runtime: org.kde.Platform
runtime-version: "6.8"
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: purpledisc
finish-args:
  - --share=network          # runtime: reach Deezer (not a build-time grant)
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --own-name=org.mpris.MediaPlayer2.PurpleDisc
build-options:
  append-path: /usr/lib/sdk/golang/bin
  env:
    GOFLAGS: "-trimpath -mod=vendor"
    GOTOOLCHAIN: local
modules:
  - name: purpledisc-unified
    buildsystem: simple
    build-commands:
      # Engine c-archive + Qt backend (.so); build.sh reads the vendored modules.
      - cd gui/kde && chmod +x build.sh && ./build.sh
      # dlopen launcher loads libpurpledisc-qt.so from its own dir ($ORIGIN).
      - cc -O2 -o purpledisc gui/linux/launcher.c -ldl -Wl,-rpath,'$ORIGIN'
      - install -Dm755 purpledisc /app/bin/purpledisc
      - install -Dm755 gui/kde/build/libpurpledisc-qt.so /app/bin/libpurpledisc-qt.so
      - install -Dm755 gui/kde/purpledisc-login /app/bin/purpledisc-login
      - install -Dm644 packaging/flatpak/dev.scharkenberg.PurpleDisc.unified.desktop
          /app/share/applications/dev.scharkenberg.PurpleDisc.unified.desktop
      - install -Dm644 assets/icon.png
          /app/share/icons/hicolor/256x256/apps/dev.scharkenberg.PurpleDisc.unified.png
      - install -Dm644 packaging/flatpak/flathub/dev.scharkenberg.PurpleDisc.unified.metainfo.xml
          /app/share/metainfo/dev.scharkenberg.PurpleDisc.unified.metainfo.xml
    sources:
      - type: git
        url: https://github.com/Scharkenberg/PurpleDisc.git
        tag: v2.1.0
        commit: 91a10327175fdeb58ca7e9e0b7e103f36fcf6606
      # Vendored Go modules (offline). Regenerate with gen-and-build.sh when go.mod
      # changes. flatpak-go-mod writes vendor/ + this sources file.
      - go.mod.yml
